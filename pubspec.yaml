name: aud_midi
description: "MIDI for Dart and Flutter apps on iOS, macOS, Android, Windows, Linux and the web: USB, Bluetooth LE, virtual and network MIDI in a MIDI isolate"
version: 1.0.0
homepage: https://github.com/audmidi/aud_midi
repository: https://github.com/audmidi/aud_midi
topics:
  - midi
  - audio
  - music

environment:
  sdk: ^3.14.0

# The example resolves together with the package, so that upgrading the
# package upgrades the example too.
workspace:
  - example
  - example/cli

dependencies:
  aud_midi_android: ^1.0.0
  aud_midi_apple: ^1.0.0
  aud_midi_core: ^1.0.0
  aud_midi_linux: ^1.0.0
  aud_midi_network: ^1.0.0
  aud_midi_standard: ^1.0.0
  aud_midi_web: ^1.0.0
  aud_midi_windows: ^1.0.0

dev_dependencies:
  dna_audanika: ^0.1.0
  lints: ^6.1.0
  # Within the test_api that flutter_test of the example pins.
  test: ^1.32.0